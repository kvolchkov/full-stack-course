<svg viewBox="0 0 250 250" width="250" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="250" height="250" rx="15" fill="#f4f6f9" />
  
  <!-- Hair tufts -->
  <path d="M120 45 L115 30 M125 43 L127 28 M130 45 L138 32" stroke="#2c3e50" stroke-width="3" stroke-linecap="round" />

  <!-- Body (Yellow Pill) -->
  <rect x="85" y="45" width="80" height="145" rx="40" fill="#fbc02d" />
  
  <!-- Executive Suit Jacket (Navy) -->
  <path d="M85 110 L125 140 L165 110 L165 190 C165 195 160 190 155 190 L95 190 C90 190 85 195 85 190 Z" fill="#1a237e" />
  <polygon points="125,140 110,110 140,110" fill="#ffffff" /> <!-- Shirt collar -->
  <polygon points="125,120 121,155 129,155" fill="#d32f2f" /> <!-- Red tie -->

  <!-- Goggles Strap -->
  <path d="M85 85 L165 85" stroke="#2c3e50" stroke-width="8" />

  <!-- Goggles Frame & Lens -->
  <circle cx="125" cy="85" r="24" fill="#b0bec5" stroke="#78909c" stroke-width="3" />
  <circle cx="125" cy="85" r="18" fill="#ffffff" stroke="#37474f" stroke-width="2" />
  <circle cx="125" cy="85" r="8" fill="#4e342e" />
  <circle cx="122" cy="82" r="3" fill="#ffffff" /> <!-- Eye reflection -->

  <!-- Confident Smile -->
  <path d="M112 110 Q125 118 138 110" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round" />

  <!-- Tablet in hand -->
  <rect x="155" y="130" width="35" height="25" rx="3" fill="#37474f" transform="rotate(-15 155 130)" />
  <rect x="158" y="133" width="29" height="19" rx="1" fill="#64b5f6" transform="rotate(-15 155 130)" />
</svg>